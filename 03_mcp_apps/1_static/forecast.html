<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>forecast</title>
<style>
  body { margin: 0; font: 14px system-ui, sans-serif; color: #1f2430; }
  .app { padding: 14px 16px; }
  h2 { margin: 0 0 2px; font-size: 18px; }
  .muted { color: #667085; font-size: 12px; }
  .days { display: grid; grid-template-columns: repeat(auto-fit, minmax(90px, 1fr)); gap: 8px; margin: 12px 0; }
  .day { background: #f3f5fb; border-radius: 10px; padding: 10px; text-align: center; }
  .icon { font-size: 26px; } .hi { font-weight: 700; font-size: 18px; }
  button { font: inherit; padding: 6px 12px; border-radius: 8px; border: 1px solid #d0d5e2; background: #fff; cursor: pointer; }
  button.on { background: #4f46e5; color: #fff; border-color: #4f46e5; }
</style>
<!--APP_BRIDGE-->
</head>
<body>
<div class="app">
  <h2 id="title">Loading…</h2>
  <div class="muted" id="sub">waiting for the tool result</div>
  <div class="days" id="days"></div>
  <button id="c" class="on">°C</button> <button id="f">°F</button>
  <button id="ask">Ask what to pack</button>
</div>
<script>
  let current = { city: "", units: "C" };
  function render(result) {
    const data = result.structuredContent;               // structured data for the app; content[] is for the model
    current = { city: data.city, units: data.units };
    document.getElementById("title").textContent = `${data.city} · next ${data.days.length} days`;
    document.getElementById("sub").textContent = "pre-built view · data from tools/call";
    document.getElementById("days").innerHTML = data.days.map((d) =>
      `<div class="day"><div>${d.day}</div><div class="icon">${d.icon}</div>` +
      `<div class="hi">${d.high}°</div><div class="muted">${d.low}° · ${d.sky}</div></div>`).join("");
    document.getElementById("c").className = data.units === "C" ? "on" : "";
    document.getElementById("f").className = data.units === "F" ? "on" : "";
    mcpApp.resized();
  }
  mcpApp.on("ui/notifications/tool-result", render);
  const units = (u) => mcpApp.callTool("get_forecast", { city: current.city, units: u }).then(render);
  document.getElementById("c").onclick = () => units("C");
  document.getElementById("f").onclick = () => units("F");
  document.getElementById("ask").onclick = () => mcpApp.say(`What should I pack for ${current.city} this weekend?`);
  mcpApp.connect();
</script>
</body>
</html>
